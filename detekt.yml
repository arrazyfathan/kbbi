config:
  validation: true

complexity:
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 8
  TooManyFunctions:
    allowedFunctionsPerFile: 12
    allowedFunctionsPerClass: 12
  LongMethod:
    ignoreAnnotated:
      - Composable
  CyclomaticComplexMethod:
    active: false

naming:
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    active: false
  UnusedPrivateProperty:
    active: false
