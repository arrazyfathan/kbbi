build:
  maxIssues: 0

config:
  validation: true

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 12
    thresholdInClasses: 12
  LongMethod:
    ignoreAnnotated:
      - Composable
  CyclomaticComplexMethod:
    active: false

naming:
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    active: false
  UnusedPrivateProperty:
    active: false
