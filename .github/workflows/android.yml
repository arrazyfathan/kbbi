name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "*.*"
      - "*-dev"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  KBBI_BASE_URL: ${{ secrets.KBBI_BASE_URL }}

jobs:
  validate:
    name: Validate Development Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests, lint, and development build
        run: ./gradlew testDevelopmentDebugUnitTest lintDevelopmentDebug assembleDevelopmentDebug --stacktrace

      - name: Verify development tag version
        if: github.event_name == 'push' && github.ref_type == 'tag' && endsWith(github.ref_name, '-dev')
        run: |
          VERSION_NAME="$(sed -n 's/.*\"versionName\": \"\([^\"]*\)\".*/\1/p' app/build/outputs/apk/development/debug/output-metadata.json | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionName from development-debug output metadata"
            exit 1
          fi
          if [ "$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "Development APK versionName $VERSION_NAME does not match pushed tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Generate development release notes
        if: github.event_name == 'push' && github.ref_type == 'tag' && endsWith(github.ref_name, '-dev')
        run: |
          CURRENT_TAG="$GITHUB_REF_NAME"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            {
              echo "Changes since ${PREVIOUS_TAG}:"
              echo
              git log "${PREVIOUS_TAG}..${GITHUB_SHA}" --pretty=format:'- %s (%h)'
              echo
            } > app/firebase/release-notes.txt
          else
            {
              echo "Initial development release ${CURRENT_TAG}"
              echo
              git log "${GITHUB_SHA}" --pretty=format:'- %s (%h)'
              echo
            } > app/firebase/release-notes.txt
          fi

      - name: Decode Firebase App Distribution service account
        if: github.event_name == 'push' && github.ref_type == 'tag' && endsWith(github.ref_name, '-dev')
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Error: FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_JSON secret is missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-app-distribution.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-app-distribution.json" >> "$GITHUB_ENV"

      - name: Upload development APK to Firebase App Distribution
        if: github.event_name == 'push' && github.ref_type == 'tag' && endsWith(github.ref_name, '-dev')
        run: ./gradlew appDistributionUploadDevelopmentDebug --stacktrace

      - name: Upload development APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: development-debug-apk
          path: app/build/outputs/apk/development/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    permissions:
      contents: write
    name: Build And Publish Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !endsWith(github.ref_name, '-dev')
    runs-on: ubuntu-latest


    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Validate release signing secrets
        run: |
          ERROR=0
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then echo "Error: ANDROID_KEYSTORE_BASE64 secret is missing"; ERROR=1; fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then echo "Error: ANDROID_KEYSTORE_PASSWORD secret is missing"; ERROR=1; fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then echo "Error: ANDROID_KEY_ALIAS secret is missing"; ERROR=1; fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then echo "Error: ANDROID_KEY_PASSWORD secret is missing"; ERROR=1; fi
          exit $ERROR

      - name: Build production release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Verifying signing configuration..."
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "!! ANDROID_KEYSTORE_PASSWORD is empty !!"; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then echo "!! ANDROID_KEY_ALIAS is empty !!"; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "!! ANDROID_KEY_PASSWORD is empty !!"; fi
          ./gradlew assembleProductionRelease --stacktrace

      - name: Verify release APK version code
        run: |
          APK_PATH="$(find app/build/outputs/apk/production/release -name '*.apk' -type f -print -quit)"
          EXPECTED_VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' app/version.properties)"

          if [ -z "$APK_PATH" ] || [ -z "$EXPECTED_VERSION_CODE" ]; then
            echo "Unable to locate the release APK or configured VERSION_CODE"
            exit 1
          fi

          ACTUAL_VERSION_CODE="$(apkanalyzer manifest version-code "$APK_PATH")"
          if [ "$ACTUAL_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "Release APK versionCode $ACTUAL_VERSION_CODE does not match configured VERSION_CODE $EXPECTED_VERSION_CODE"
            exit 1
          fi

      - name: Verify Crashlytics mapping output
        run: |
          MAPPING_FILE="app/build/outputs/mapping/productionRelease/mapping.txt"
          if [ ! -s "$MAPPING_FILE" ]; then
            echo "Crashlytics mapping file is missing or empty: $MAPPING_FILE"
            exit 1
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-release-apk
          path: |
            app/build/outputs/apk/production/release/*.apk
            app/build/outputs/mapping/productionRelease/mapping.txt
            app/build/outputs/mapping/productionRelease/seeds.txt
            app/build/outputs/mapping/productionRelease/usage.txt
          if-no-files-found: error
          retention-days: 30

      - name: Capture release commit notes
        run: |
          git fetch --tags

          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -Fxv "$CURRENT_TAG" | head -n 1)"

          if [ -n "$PREVIOUS_TAG" ]; then
            {
              echo "RELEASE_NOTES<<EOF"
              echo "Changes since ${PREVIOUS_TAG}:"
              echo
              git log "${PREVIOUS_TAG}..${CURRENT_TAG}" --pretty=format:'- %s (%h)'
              echo
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "RELEASE_NOTES<<EOF"
              echo "Initial release ${CURRENT_TAG}"
              echo
              git log "${CURRENT_TAG}" --pretty=format:'- %s (%h)'
              echo
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/production/release/*.apk
          body: ${{ env.RELEASE_NOTES }}
