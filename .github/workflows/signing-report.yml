name: Production Signing Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-report:
    name: Print Production Signing Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate production signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "Error: ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "Error: ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then echo "Error: ANDROID_KEY_ALIAS secret is missing"; exit 1; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "Error: ANDROID_KEY_PASSWORD secret is missing"; exit 1; fi

      - name: Decode production keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Print signing report
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:signingReport --console=plain
